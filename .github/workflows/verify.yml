name: Verify frozen release
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify archived true results without evaluator
        run: python run.py reproduce --output outputs/reproduced
      - name: Install fixed CPU packages
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-common.lock
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r config/torch-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.lock
      - name: Check environment and model contracts
        run: |
          python run.py doctor
          python run.py test
      - name: Check independent-process repeatability
        run: python run.py check-determinism --reference validation/cpu-smoke-reference.npz --output outputs/determinism
      - name: Upload measured runtime and numerical differences
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: outputs/determinism/report.json
