name: Verify frozen release
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify archived true results without evaluator
        run: python run.py reproduce --output outputs/reproduced
      - name: Install exact Python and CPU environment, then run doctor and tests
        run: python bootstrap.py
      - name: Check independent-process repeatability
        run: ${{ matrix.python }} run.py check-determinism --reference validation/cpu-smoke-reference.npz --output outputs/determinism
      - name: Upload measured runtime and numerical differences
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: outputs/determinism/report.json
